<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Математика без ошибок: шпаргалка 7 класса</title>
<style>

:root{color-scheme:light;--bg:linear-gradient(135deg,#6a1bf0,#3510a8);--s:#fff;--t:#1d1a2b;--p:#5b16e0;--on:#fff;--o:#ff9a57;--l:#c3f77e;--v:#ece4ff;--g:#f2f1f5;--in:#f7f6fa;--line:#e3dfee;--f:system-ui,-apple-system,sans-serif;--r:24px;--rb:30px;--up:uppercase}

*{box-sizing:border-box}body{margin:0;background:var(--bg);font:17px/1.5 var(--f);padding:20px 12px}

#app{max-width:960px;margin:auto;background:var(--s);border-radius:calc(var(--r) + 4px);padding:clamp(16px,4vw,34px);color:var(--t)}

#app *{color:inherit}#app h1{color:var(--hc,var(--p));font-size:clamp(40px,9vw,92px);line-height:.92;letter-spacing:-.05em;font-weight:900;text-transform:var(--up);margin:28px 0 16px;max-width:85%}

#app h2{font-size:clamp(23px,4vw,34px);line-height:1.1;margin:8px 0}#app h3{font-size:20px;margin:0 0 8px}

header{display:flex;justify-content:space-between;align-items:center;gap:10px;font:800 13px/1.3 var(--f);text-transform:uppercase}

button{cursor:pointer;border:0;border-radius:var(--rb);padding:12px 18px;background:var(--p);color:var(--on)!important;font:700 15px var(--f);min-height:44px;margin:4px 4px 4px 0}

button.a{background:var(--g);color:var(--t)!important}

.hero{position:relative}.hero p{max-width:470px;font-weight:600}.blob{position:absolute;right:4%;bottom:0;width:100px;height:100px;background:radial-gradient(circle at 30% 25%,#fff9,var(--o) 60%);border-radius:45% 55% 62% 38%;box-shadow:14px 8px 0 var(--l)}

.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.tile{border-radius:var(--r);padding:22px}.tile>b{display:block;font-size:clamp(20px,3vw,30px);line-height:1.1}

.or{background:var(--o);grid-row:span 2}.gr{background:var(--g)}.li{background:var(--l)}.pu{background:var(--p);color:var(--on)!important}.pu *{color:var(--on)!important}.wide{grid-column:1/-1}

input,textarea{width:100%;font:inherit;border:2px solid var(--line);background:var(--in);color:var(--t)!important;border-radius:calc(var(--r)*.65);padding:13px 15px;margin:6px 0}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 16px}.chips button{min-height:36px;padding:8px 14px;font-size:13px}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:140px;border-radius:calc(var(--r) - 2px);padding:18px;margin:0;color:var(--t)!important;font:800 19px/1.2 var(--f)}

.card small{font:700 12px var(--f);opacity:.7}.card i{font-style:normal;text-align:right;font-size:24px}

.card:nth-child(4n+1){background:var(--v)}.card:nth-child(4n+2){background:var(--g)}.card:nth-child(4n+3){background:var(--l)}.card:nth-child(4n){background:var(--o)}

.pan{background:var(--g);border-radius:calc(var(--r) - 2px);padding:20px;margin:12px 0}.box{background:var(--v);border-radius:calc(var(--r)*.6);padding:13px 15px;margin:10px 0}

.ok{background:#d9f7e3}.no{background:#ffe1d6}.ok,.no,.ok *,.no *{color:#1d1a2b!important}.o{display:block;width:100%;text-align:left;background:var(--in);color:var(--t)!important;border:2px solid var(--line);border-radius:calc(var(--r)*.6);font-weight:600}

.pan button.a{background:var(--s)}.mut{font-size:13px;opacity:.65}.foot{text-align:center;font-size:12px;opacity:.6;margin-top:24px}

@media(max-width:560px){body{padding:8px}.blob{width:60px;height:60px;opacity:.85}.hero p{max-width:72%}.tile{padding:15px}.card{min-height:120px;padding:13px;font-size:16px}}

</style></head><body><main id="app"></main>
<script>
const TITLE="Математика без ошибок: шпаргалка 7 класса", SUB="Найди свою ошибку, разбери правило и проверь себя.", CLS="7 класс";

at":"Десятичные дроби","q":"Почему ответ слишком большой?","src":0,"e":"<b>Проверяй ответ прикидкой.</b> Округли числа до удобных и оцени порядок результата: при умножении на число меньше 1 положительное число уменьшается.","ex":"0,2 · 0,3 = 0,06, а не 6","st":["Оцени размер чисел","Прикинь результат округлением","Сравни точный ответ с прикидкой"],"c":["Проверь, должен ли результат быть больше исходного","Выполни обратное действие"],"help":["0,2 · 0,3 меньше 0,2.","1,9 · 3,1 примерно 2 · 3 = 6; точный ответ 5,89.","Частая ошибка: пропустить нули после запятой."],"t":[{"y":"choice","q":"Сколько примерно 1,9 · 3,1?","o":["6","60","0,06"],"a":0,"h":"Округли до 2 и 3.","s":"2 · 3 = 6."},{"y":"choice","q":"Какое значение 0,4 · 0,5?","o":["0,2","2","20"],"a":0,"h":"Произведение положительных чисел меньше 1.","s":"0,4 · 0,5 = 0,20."},{"y":"input","q":"Найди точный ответ: 2,4 · 0,25","a":["0,6"],"h":"Четверть от 2,4 — это 0,6.","s":"2,4 : 4 = 0,6."}]},{"cat":"Рациональные числа","q":"Почему минус на минус даёт плюс?","src":0,"e":"<b>При умножении и делении двух отрицательных чисел результат положительный.</b> При сложении двух отрицательных чисел результат отрицательный: сложи их модули и поставь минус.","ex":"(-3) · (-4) = 12, но -3 + (-4) = -7","st":["Определи действие","Примени правило знаков для него","Выполни действие с модулями"],"c":["Сравни умножение и сложение: правила разные","Проверь умножение делением: 12 : (-4) = -3"],"help":["Сначала назови действие: плюс или умножить.","(-2) · (-5) = 10, но -2 + (-5) = -7.","Частая ошибка: переносить правило умножения на сложение."],"t":[{"y":"choice","q":"(-4) · (-3) = ?","o":["12","-12","-7"],"a":0,"h":"Два минуса при умножении дают плюс.","s":"4 · 3 = 12."},{"y":"input","q":"Вычисли: -4 + (-3)","a":["-7"],"h":"При сложении отрицательных сохраняется минус.","s":"-(4 + 3) = -7."},{"y":"input","q":"Вычисли: (-2,5) · (-1,2)","a":["3"],"h":"Знак плюс, затем умножь модули.","s":"2,5 · 1,2 = 3."}]},{"cat":"Рациональные числа","q":"Как сложить числа с разными знаками?","src":0,"e":"<b>Вычти меньший модуль из большего.</b> Поставь знак числа с большим модулем. Если модули равны, сумма равна нулю.","ex":"-8 + 5 = -3","st":["Найди модули слагаемых","Вычти меньший модуль из большего","Поставь знак большего по модулю числа"],"c":["Прикинь, в какую сторону от нуля результат","Проверь обратным вычитанием: -3 - 5 = -8"],"help":["Смотри не на знак, а на модуль: |-8| = 8.","-6 + 10 = 4: модуль 10 больше, поэтому плюс.","Частая ошибка: выбирать знак того числа, которое записано первым."],"t":[{"y":"choice","q":"-7 + 3 = ?","o":["-4","4","-10"],"a":0,"h":"7 больше 3, знак будет минус.","s":"7 - 3 = 4, ответ -4."},{"y":"input","q":"Вычисли: 6 + (-11)","a":["-5"],"h":"Сравни модули 6 и 11.","s":"11 - 6 = 5, знак минус."},{"y":"input","q":"Вычисли: -2,75 + 4,5","a":["1,75"],"h":"Вычти 2,75 из 4,5.","s":"4,5 - 2,75 = 1,75."}]},{"cat":"Рациональные числа","q":"Почему вычитание становится сложением?","src":0,"e":"<b>Вычесть число — значит прибавить противоположное.</b> Запомни: a - b = a + (-b).","ex":"-7 - (-12) = -7 + 12 = 5","st":["Замени вычитание сложением","Измени знак вычитаемого на противоположный","Сложи получившиеся числа"],"c":["Проверь: результат плюс вычитаемое даёт уменьшаемое","Подставь простой пример: 5 - (-2) = 7"],"help":["Вычитаемое — число после знака вычитания.","3 - (-4) = 3 + 4 = 7.","Частая ошибка: менять знак обоих чисел, а не только вычитаемого."],"t":[{"y":"choice","q":"5 - (-2) = ?","o":["7","3","-7"],"a":0,"h":"Пять плюс два.","s":"5 + 2 = 7."},{"y":"input","q":"Вычисли: -7 - (-12)","a":["5"],"h":"Запиши -7 + 12.","s":"-7 + 12 = 5."},{"y":"input","q":"Вычисли: -3,5 - (-1,2)","a":["-2,3"],"h":"Замени вычитание сложением.","s":"-3,5 + 1,2 = -2,3."}]},{"cat":"Рациональные числа","q":"Как не запутаться в нескольких минусах?","src":0,"e":"<b>Различай знак числа и действие вычитания.</b> Сначала раскрой скобки или замени вычитание сложением противоположного, затем считай по порядку.","ex":"-4 - (-6) + (-3) = -4 + 6 - 3 = -1","st":["Отметь знаки чисел и действия","Замени вычитание отрицательных чисел сложением","Выполни сложение и вычитание слева направо"],"c":["Пересчитай, группируя положительные и отрицательные числа","Проверь промежуточные значения на числовой прямой"],"help":["Два соседних минуса могут означать вычитание отрицательного числа.","-2 - (-5) - 4 = -2 + 5 - 4 = -1.","Частая ошибка: считать каждый минус одинаково, не различая его роль."],"t":[{"y":"choice","q":"-3 - (-5) = ?","o":["2","-8","-2"],"a":0,"h":"Замени на -3 + 5.","s":"-3 + 5 = 2."},{"y":"input","q":"Вычисли: -2 - (-5) - 4","a":["-1"],"h":"Получится -2 + 5 - 4.","s":"3 - 4 = -1."},{"y":"input","q":"Вычисли: -4 - (-6) + (-3)","a":["-1"],"h":"Раскрой: -4 + 6 - 3.","s":"-4 + 6 - 3 = -1."}]},{"cat":"Раскрытие скобок","q":"Нужно ли менять знаки после минуса?","src":0,"e":"<b>Минус перед скобками меняет знак каждого слагаемого внутри.</b> После раскрытия знак минус перед скобками исчезает.","ex":"a - (b - c) = a - b + c","st":["Найди минус перед скобками","Измени каждый знак внутри скобок","Убери скобки и внешний минус"],"c":["Подставь a=10, b=4, c=2 в оба выражения","Проверь, что изменился знак каждого слагаемого"],"help":["Меняй не один знак, а все знаки внутри.","8 - (3 - 5) = 8 - 3 + 5 = 10.","Частая ошибка: поменять знак только у первого слагаемого."],"t":[{"y":"choice","q":"a - (b - c) = ?","o":["a - b + c","a - b - c","a + b - c"],"a":0,"h":"Знаки у b и -c меняются.","s":"Минус перед скобками меняет оба знака."},{"y":"input","q":"Вычисли: 10 - (4 - 7)","a":["13"],"h":"Раскрой: 10 - 4 + 7.","s":"10 - 4 + 7 = 13."},{"y":"choice","q":"Раскрой: 2x - (3x - 5)","o":["-x + 5","-x - 5","5x - 5"],"a":0,"h":"Получится 2x - 3x + 5.","s":"2x - 3x + 5 = -x + 5."}]},{"cat":"Раскрытие скобок","q":"Что делать с плюсом перед скобками?","src":0,"e":"<b>Плюс перед скобками позволяет убрать скобки без смены знаков.</b> Каждое слагаемое остаётся со своим знаком.","ex":"a + (b - c) = a + b - c","st":["Найди плюс перед скобками","Сохрани знаки всех слагаемых","Убери плюс перед скобками и скобки"],"c":["Подставь числа и сравни обе записи","Сверь знаки каждого слагаемого до и после"],"help":["Перед скобками плюс, поэтому ничего не переворачивай.","4 + (6 - 2) = 4 + 6 - 2 = 8.","Частая ошибка: поменять знак минуса внутри скобок на плюс."],"t":[{"y":"choice","q":"a + (b - c) = ?","o":["a + b - c","a + b + c","a - b + c"],"a":0,"h":"Сохрани минус перед c.","s":"Знаки остаются прежними."},{"y":"input","q":"Вычисли: 5 + (3 - 8)","a":["0"],"h":"Запиши 5 + 3 - 8.","s":"5 + 3 - 8 = 0."},{"y":"choice","q":"Раскрой: 2x + (-3x + 4)","o":["-x + 4","5x + 4","-x - 4"],"a":0,"h":"2x - 3x = -x.","s":"2x - 3x + 4 = -x + 4."}]},{"cat":"Раскрытие скобок","q":"Как раскрыть скобки с множителем?","src":0,"e":"<b>Умножь число перед скобками на каждое слагаемое.</b> Учитывай знаки при каждом умножении.","ex":"-2(x - 3) = -2x + 6","st":["Найди множитель перед скобками","Умножь его на каждое слагаемое","Проверь знаки и запиши сумму"],"c":["Подставь x=2 в исходную и новую запись","Проверь число полученных слагаемых"],"help":["Умножать надо и на x, и на число.","3(x - 2) = 3x - 6.","Частая ошибка: умножать только первое слагаемое."],"t":[{"y":"choice","q":"2(x + 3) = ?","o":["2x + 6","2x + 3","x + 6"],"a":0,"h":"Умножь на 2 каждое слагаемое.","s":"2 · x + 2 · 3 = 2x + 6."},{"y":"choice","q":"-3(x - 2) = ?","o":["-3x + 6","-3x - 6","3x + 6"],"a":0,"h":"(-3) · (-2) = +6.","s":"-3x + 6."},{"y":"choice","q":"-2(3x - 4) + x = ?","o":["-5x + 8","-6x + 8","-5x - 8"],"a":0,"h":"Раскрой скобки, затем приведи подобные.","s":"-6x + 8 + x = -5x + 8."}]}];
const $=s=>document.querySelector(s),app=$("#app");let S={},F="Все",Q="";
const nz=v=>String(v).toLowerCase().replace(/ё/g,"е").replace(/[−–]/g,"-").replace(/\s*([\/:+\-=×*])\s*/g,"$1").replace(/\s+/g," ").trim().replace(/,/g,".").replace(/[«»"']/g,"").replace(/[.!?…]+$/,"");
const mix=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pl=(n,a,b,c)=>n+" "+(n%10==1&&n%100!=11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c);
const N=DATA.reduce((s,d)=>s+(d.t||[]).length,0),CATS=["Все",...new Set(DATA.map(d=>d.cat))];
const hd=()=>`<header><div>🟠 ${TITLE}<br>${CLS}</div><button class="a" data-k="teach">Для учителя ↗</button></header>`;
function home(){S={};app.innerHTML=hd()+`<div class="hero"><h1>${TITLE}</h1><p>${SUB}</p><div class="blob"></div></div>
<div class="bento"><div class="tile or"><small>ТВОЯ БАЗА ЗНАНИЙ ✳</small><h2>Ошибаться можно.<br>Не разобраться — обидно!</h2></div><div class="tile gr"><b>${pl(DATA.length,"тема","темы","тем")}<br>в одном месте</b></div><div class="tile li"><b>${pl(N,"задание","задания","заданий")} ↗</b><p>Проверяй себя сразу</p></div><div class="tile pu wide"><b>Забыл правило? Найдём за минуту ✳</b></div></div>
<h2>Выбери свою ошибку ↗</h2><input id="q" placeholder="Поиск по ошибкам и правилам…" aria-label="Поиск" value="${Q}"><div class="chips">${CATS.map(c=>`<button class="${c==F?"":"a"}" data-k="cat" data-c="${c}">${c}</button>`).join("")}</div><div class="cards" id="L"></div><div class="foot">${TITLE} · ${CLS}</div>`;list();$("#q").oninput=e=>{Q=e.target.value;list()}}
function list(){const v=nz(Q);$("#L").innerHTML=DATA.map((d,i)=>(F=="Все"||d.cat==F)&&nz(d.cat+" "+d.q+" "+d.e+" "+d.ex).includes(v)?`<button class="card" data-k="item" data-i="${i}"><small>№ ${String(i+1).padStart(2,"0")} / ${d.cat}</small>${d.q}<i>↗</i></button>`:"").join("")||"<p>Ничего не нашлось. Попробуй другое слово.</p>"}
function item(i){const d=DATA[i];S={i,hl:1};app.innerHTML=hd()+`<button class="a" data-k="home">← Ко всем темам</button><div class="tile pu"><small>${d.cat} · ТЕМА ${i+1}</small><h2>${d.q}</h2></div>
<div class="pan"><h3>01 / Главное правило</h3><p>${d.e}</p><div class="box"><b>Пример:</b> ${d.ex}</div></div><div class="pan"><h3>02 / Порядок действий</h3><ol>${d.st.map(x=>`<li>${x}</li>`).join("")}</ol></div><div class="pan"><h3>03 / Самопроверка</h3><ul>${d.c.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="pan"><h3>04 / Если не получается</h3><div id="H"></div></div>
${d.t&&d.t.length?`<div class="tile li"><h2>05 / Потренируйся!</h2><div id="T"><p>${pl(d.t.length,"задание","задания","заданий")} с проверкой</p><button data-k="start">Начать ↗</button></div></div>`:""}<p class="mut">Источник: общие знания и открытые образовательные материалы; сверьте с учебником.</p>`;help();scrollTo(0,0)}
function help(){const h=DATA[S.i].help;$("#H").innerHTML=h.slice(0,S.hl).map((x,j)=>`<div class="box"><b>Ступень ${j+1}</b><br>${x}</div>`).join("")+(S.hl<h.length?`<button class="a" data-k="more">Ещё подсказка ↗</button>`:`<p>Всё ещё сложно? Спроси учителя или одноклассника и покажи, на каком шаге застрял.</p>`)}
function start(again){const t=DATA[S.i].t;S.list=again?mix(t):t.slice();S.k=0;S.ok=0;task()}
function task(){const t=S.list[S.k];S.tries=0;S.done=0;let h=`<p><b>Задание ${S.k+1} / ${S.list.length}</b></p><h3>${t.q}</h3>`;
if(t.y=="choice")h+=mix(t.o.map((x,j)=>j)).map(j=>`<button class="o" data-k="ch" data-j="${j}">${t.o[j]}</button>`).join("");
else if(t.y=="input")h+=`<input id="A" placeholder="Твой ответ" autocomplete="off"><button data-k="chk">Проверить</button>`;
else h+=`<textarea id="A" rows="3" placeholder="Напиши ответ"></textarea><button data-k="cmp">Сравнить с образцом</button>`;
$("#T").innerHTML=h+`<div id="F"></div>`;const a=$("#A");if(a&&t.y=="input")a.onkeydown=e=>{if(e.key=="Enter")judge(a.value)}}
const fb=(c,m)=>$("#F").innerHTML=`<div class="box ${c}">${m}</div>`;
const next=()=>`<button data-k="next">${S.k+1<S.list.length?"Дальше ↗":"Итог ↗"}</button>`;
function judge(v){const t=S.list[S.k];if(S.done)return;let ok;if(t.y=="choice")ok=+v===t.a;else{v=nz(v);if(!v)return;if(t.n){for(const k in t.n)if(nz(k)==v)return fb("",t.n[k])}ok=t.a.some(x=>nz(x)==v)}
if(ok){if(!S.tries)S.ok++;S.done=1;fb("ok","<b>Верно!</b> "+t.s);$("#F").innerHTML+=next()}
else if(++S.tries<2)fb("no","Не совсем. Подсказка: "+t.h);
else{S.done=1;fb("no",`<b>Правильный ответ:</b> ${t.y=="choice"?t.o[t.a]:t.a[0]}. ${t.s}`);$("#F").innerHTML+=next()}}
function done(){$("#T").innerHTML=`<h2>Готово! ✳</h2><p>С первой попытки: <b>${S.ok} из ${S.list.length}</b></p><button data-k="again">Повторить</button><button class="a" data-k="home">Другие темы</button>`}
function teach(){app.innerHTML=hd()+`<button class="a" data-k="home">← Назад</button><div class="tile pu"><h2>Для учителя ✳</h2><p>Ответы ко всем заданиям</p></div>`+DATA.map((d,i)=>`<div class="pan"><h3>${i+1}. ${d.q}</h3><p class="mut">Общие знания — сверьте с учебником</p><ol>`+(d.t||[]).map(t=>`<li>${t.q}<br><b>Ответ: ${t.y=="choice"?t.o[t.a]:t.y=="open"?t.a:t.a.join(" / ")}</b><br><small>${t.s}</small></li>`).join("")+"</ol></div>").join("")}
app.onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(k=="home")home();if(k=="teach")teach();if(k=="item")item(+b.dataset.i);if(k=="cat"){F=b.dataset.c;home()}if(k=="more"){S.hl++;help()}if(k=="start")start(0);if(k=="again")start(1);if(k=="ch")judge(b.dataset.j);if(k=="chk")judge($("#A").value);if(k=="next"){S.k++;S.k<S.list.length?task():done()}};
home();
</script></body></html>
